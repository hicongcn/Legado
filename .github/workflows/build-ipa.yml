name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Pods (patch Podfile target name)
      run: |
        sed -i '' "s/target 'LegadoTests'/target 'swiftLegadoTests'/" Podfile
        pod install

    - name: Build (device, unsigned)
      run: |
        set -o pipefail
        xcodebuild build \
          -workspace Legado.xcworkspace \
          -scheme Legado \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DD \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
          > build.log 2>&1 || true
        grep -E "error:" build.log | grep -v "0 errors" | sort -u | head -30 || true
        tail -5 build.log

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
