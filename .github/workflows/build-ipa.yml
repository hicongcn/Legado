name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Pods
      run: pod install --repo-update

    - name: Build (device, unsigned)
      run: |
        set -o pipefail
        xcodebuild build \
          -workspace Legado.xcworkspace \
          -scheme Legado \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DD \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

    - name: Package IPA
      run: |
        mkdir -p ipa/Payload
        cp -R "build/DD/Build/Products/Release-iphoneos/Legado.app" ipa/Payload/
        cd ipa && zip -qry Legado-unsigned.ipa Payload

    - uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-unsigned-ipa
        path: ipa/Legado-unsigned.ipa
